<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body {
            width: 350px;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            margin: 0;
        }
        
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .header h1 {
            margin: 0;
            font-size: 18px;
            font-weight: 600;
        }
        
        .status {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
        }
        
        .status.login-detected {
            background: rgba(255, 193, 7, 0.2);
            border: 1px solid rgba(255, 193, 7, 0.5);
        }
        
        .status.ready {
            background: rgba(40, 167, 69, 0.2);
            border: 1px solid rgba(40, 167, 69, 0.5);
        }
        
        .button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .button.primary {
            background: #28a745;
            color: white;
        }
        
        .button.primary:hover {
            background: #218838;
        }
        
        .button.secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        .button.secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        .button.warning {
            background: #ffc107;
            color: #212529;
        }
        
        .button.warning:hover {
            background: #e0a800;
        }
        
        .button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .config-section {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .config-section h3 {
            margin: 0 0 10px 0;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.9);
        }
        
        .toggle-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 8px 0;
        }
        
        .toggle-container label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.8);
        }
        
        .toggle {
            position: relative;
            width: 40px;
            height: 20px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        
        .toggle.active {
            background: #28a745;
        }
        
        .toggle::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 16px;
            height: 16px;
            background: white;
            border-radius: 50%;
            transition: left 0.3s ease;
        }
        
        .toggle.active::after {
            left: 22px;
        }
        
        .progress {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            overflow: hidden;
            margin: 10px 0;
        }
        
        .progress-bar {
            height: 100%;
            background: #28a745;
            width: 0%;
            transition: width 0.3s ease;
        }
        
        .log {
            background: rgba(0, 0, 0, 0.2);
            padding: 10px;
            border-radius: 6px;
            max-height: 100px;
            overflow-y: auto;
            font-size: 11px;
            font-family: monospace;
            margin-top: 10px;
        }
        
        .log-entry {
            margin: 2px 0;
            opacity: 0.8;
        }
        
        .log-entry.success {
            color: #90EE90;
        }
        
        .log-entry.error {
            color: #FFB6C1;
        }
        
        .log-entry.warning {
            color: #FFE4B5;
        }
        
        .footer {
            text-align: center;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 11px;
            color: rgba(255, 255, 255, 0.6);
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🚀 Job Application Assistant</h1>
    </div>
    
    <div id="status" class="status">
        <div id="status-text">Checking page...</div>
    </div>
    
    <button id="fillForm" class="button primary">⚡ Fill Application Form</button>
    <button id="loginHelp" class="button warning" style="display:none;">🔐 Login Detected - Click After Login</button>
    
    <div class="progress" id="progressContainer" style="display:none;">
        <div class="progress-bar" id="progressBar"></div>
    </div>
    
    <div class="config-section">
        <h3>⚙️ Settings</h3>
        <div class="toggle-container">
            <label>Auto-detect login pages</label>
            <div class="toggle active" id="autoLogin"></div>
        </div>
        <div class="toggle-container">
            <label>Fast mode (2x speed)</label>
            <div class="toggle active" id="fastMode"></div>
        </div>
        <div class="toggle-container">
            <label>Show progress logs</label>
            <div class="toggle" id="showLogs"></div>
        </div>
        
        <button id="configBtn" class="button secondary">📝 Edit Configuration</button>
        <button id="resetBtn" class="button secondary">🔄 Reset Settings</button>
    </div>
    
    <div class="log" id="logContainer" style="display:none;">
        <div id="logContent"></div>
    </div>
    
    <div class="footer">
        <div>v1.0 - Fast & Intelligent Form Filling</div>
    </div>
    
    <script src="popup.js"></script>
</body>
</html>
